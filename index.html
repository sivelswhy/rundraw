<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5a1f'/%3E%3Cpath d='M8 22c3-9 6-12 8-6s5 3 8-6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>RunDraw</title>
  </head>
  <body>
    <div id="map" aria-label="Carte"></div>

    <form class="search glass" id="search" role="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
      <input id="search-input" type="search" placeholder="Où veux-tu dessiner ?" autocomplete="off" enterkeyhint="search" />
    </form>
    <button class="locate glass" id="locate" type="button" aria-label="Me localiser">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M17 3 3 9.5l6 1.5 1.5 6z" /></svg>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="sheet glass" id="sheet" aria-label="Panneau">
      <header class="sheet-head" id="sheet-head">
        <div class="grabber" aria-hidden="true"></div>
        <nav class="steps" role="tablist" aria-label="Étapes">
          <button role="tab" data-step="draw" aria-selected="true"><span>1</span>Dessin</button>
          <button role="tab" data-step="place" disabled><span>2</span>Parcours</button>
        </nav>
      </header>

      <div class="sheet-body">
        <!-- Étape 1 : créer la forme -->
        <div class="panel" data-panel="draw">
          <div class="segmented" role="radiogroup" aria-label="Type de dessin" id="source-tabs">
            <button role="radio" data-source="text" aria-checked="true">Texte</button>
            <button role="radio" data-source="image" aria-checked="false">Image</button>
            <button role="radio" data-source="hand" aria-checked="false">À main levée</button>
          </div>

          <div data-source-panel="text">
            <input class="field text-input" id="text-input" maxlength="16" value="RUN" autocomplete="off" spellcheck="false" aria-label="Texte à dessiner" />
            <p class="hint" id="text-hint">Lettres, chiffres, ! - + . et ♥ (tape &lt;3).</p>
          </div>

          <div data-source-panel="image" hidden>
            <label class="drop" id="drop">
              <input type="file" id="image-input" accept="image/*" />
              <span id="drop-label">Choisis une image : logo, silhouette, pictogramme…</span>
            </label>
            <div class="image-controls" id="image-controls" hidden>
              <label class="slider-row">
                <span>Seuil</span>
                <input type="range" id="threshold" min="10" max="245" value="128" />
              </label>
              <label class="switch-row">
                <span>Inverser clair / foncé</span>
                <input type="checkbox" id="invert" role="switch" />
              </label>
            </div>
          </div>

          <div data-source-panel="hand" hidden>
            <div class="pad-wrap">
              <canvas id="pad" aria-label="Zone de dessin"></canvas>
              <button class="pill" type="button" id="pad-clear">Effacer</button>
            </div>
            <p class="hint">Dessine d'un trait : chaque levé de doigt sera relié au trait suivant.</p>
          </div>

          <div class="preview" id="preview" aria-hidden="true">
            <svg id="preview-svg" viewBox="-0.6 -0.6 1.2 1.2"><path id="preview-path" /><circle id="preview-start" r="0.025" /></svg>
          </div>

          <button class="primary" type="button" id="place-btn" disabled>Poser sur la carte</button>
        </div>

        <!-- Étape 2 : placer, caler, exporter -->
        <div class="panel" data-panel="place" hidden>
          <p class="hint lead">Fais glisser le dessin pour le déplacer. La poignée orange l'agrandit et le fait tourner.</p>

          <div class="stats">
            <div><span class="stat-value" id="stat-design">–</span><span class="stat-label">Dessin</span></div>
            <div><span class="stat-value" id="stat-route">–</span><span class="stat-label">À courir</span></div>
          </div>

          <label class="slider-row">
            <span>Taille</span>
            <input type="range" id="size" min="0" max="1000" value="400" />
            <output id="size-out"></output>
          </label>
          <label class="slider-row">
            <span>Rotation</span>
            <input type="range" id="rotation" min="-180" max="180" value="0" />
            <output id="rotation-out"></output>
          </label>

          <label class="switch-row">
            <span>Caler sur les rues</span>
            <input type="checkbox" id="snap-toggle" role="switch" checked />
          </label>
          <p class="hint" id="snap-hint"></p>
          <button class="secondary" type="button" id="align-btn">Aligner sur les rues</button>

          <button class="primary" type="button" id="export-btn">Exporter le GPX</button>
        </div>

      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
